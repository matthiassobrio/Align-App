<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ALIGN — Profile (full page)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #08111F; }
  body {
    font-family: 'Inter Tight', sans-serif; color: #FFF;
    min-height: 100vh;
  }
  #root {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #0D1F3C 0%, #08111F 100%);
    overflow: hidden;
  }
  /* Override Screen padding behaviour — let the profile breathe across the whole viewport */
  #root > .__profile-host { width: 100%; height: 100%; position: relative; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const [isPro, setIsPro] = React.useState(false);
  return (
    <div className="__profile-host" data-screen-label="Profile (full page)">
      <ProfileScreen
        tab="profile"
        onTabChange={() => {}}
        isPro={isPro}
        onOpenPro={() => setIsPro(true)}
        onClose={() => {}}
      />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
